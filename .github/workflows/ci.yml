name: CI

on:
  push:
  pull_request:

jobs:
  fresh-install:
    name: Fresh install (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install from a clean checkout
        run: python -m pip install -e ".[dev,litellm]"
      - name: Run offline onboarding commands
        run: |
          python examples/basic_student.py
          student-agent personas
      - name: Run tests
        run: pytest
      - name: Run lint checks
        run: ruff check src tests examples
